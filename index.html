<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #8b5e1a; --gold-light: #6b4510; --gold-dim: #a0783a;

}
body {
  font-family: 'EB Garamond', serif;
  background: var(--bg); color: var(--text);
  max-width: 860px; margin: 0 auto;
  padding: 0 0 60px; font-size: 16px; line-height: 1.6;
}
/* ── Top nav bar ── */
.site-nav { background: var(--header-bg); border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 42px; position: sticky; top: 0; z-index: 100; }
.nav-home { font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.2em; color: var(--gold); text-decoration: none; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; }
.nav-home.kn { font-family: 'Noto Serif Kannada', serif; letter-spacing: 0.05em; text-transform: none; font-size: 0.88rem; }
.nav-home:hover { text-decoration: underline; }
.nav-links { display: flex; align-items: center; gap: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.nav-links::-webkit-scrollbar { display: none; }
.nav-link { font-family: 'EB Garamond', serif; font-size: 0.78rem; color: var(--meta); text-decoration: none; padding: 0 10px; line-height: 42px; white-space: nowrap; border-left: 1px solid var(--border); transition: color 0.15s, background 0.15s; }
.nav-link:first-child { border-left: none; }
.nav-link:hover { color: var(--gold); background: rgba(139,94,26,0.06); }
.nav-link.active-section { color: var(--gold); font-weight: 600; }
.nav-link.kn { font-family: 'Noto Sans Kannada', sans-serif; font-size: 0.72rem; }
/* ── Page header ── */
.page-header {
  text-align: center; padding: 36px 20px 24px;
  border-bottom: 1px solid var(--border); position: relative;
}
.page-header::after {
  content: ''; display: block; height: 2px; width: 160px; margin: 0 auto;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%);
}
.page-title {
  font-family: 'Cinzel', serif; font-size: 1.5rem;
  letter-spacing: 0.22em; color: var(--gold); text-transform: uppercase;
}
.page-title.kn {
  font-family: 'Noto Serif Kannada', serif; letter-spacing: 0.05em; text-transform: none;
}
.page-subtitle { font-size: 0.95em; color: var(--gold-dim); margin-top: 6px; font-style: italic; }
.page-subtitle.kn { font-family: 'Noto Sans Kannada', sans-serif; font-style: normal; }
/* ── Lang toggle ── */
.lang-toggle {
  position: absolute; top: 24px; right: 24px;
  background: var(--header-bg); border: 1px solid var(--border-light);
  border-radius: 20px; padding: 5px 4px; display: flex; gap: 3px;
}
.lang-btn { font-size: 0.75rem; padding: 4px 10px; border-radius: 16px; border: none; background: none; cursor: pointer; color: var(--meta); font-family: 'EB Garamond', serif; transition: all 0.18s; }
.lang-btn.active { background: var(--gold); color: #fff; font-weight: 600; }
.lang-btn.kn-btn { font-family: 'Noto Sans Kannada', sans-serif; font-size: 0.78rem; }
/* ── Intro text box ── */
.intro-textbox {
  max-width: 680px; margin: 20px auto 0; padding: 20px;
  background: var(--section-bg); border: 1px solid var(--border-light);
  border-radius: 6px; font-size: 1rem; line-height: 1.75;
}
.intro-textbox.kn { font-family: 'Noto Sans Kannada', sans-serif; font-size: 0.9rem; }
/* ── Section heading ── */
.section-heading { font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--meta); text-align: center; margin: 40px 0 20px; }
.section-heading.kn { font-family: 'Noto Sans Kannada', sans-serif; font-size: 0.92rem; letter-spacing: 0.05em; text-transform: none; }
/* ── Media grid ── */
.media-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 20px; }
.media-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
/* Video container */
.video-container { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 0; overflow: hidden; }
.video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
.video-placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.play-btn-overlay { width: 48px; height: 34px; background-color: rgba(26,18,8,0.75); border-radius: 8px; position: relative; transition: background-color 0.18s, transform 0.18s; }
.video-placeholder:hover .play-btn-overlay { background-color: var(--gold); transform: scale(1.08); }
.play-btn-overlay::after { content: ''; position: absolute; top: 10px; left: 20px; border-style: solid; border-width: 7px 0 7px 11px; border-color: transparent transparent transparent #ffffff; }
.media-info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
.media-label { font-size: 0.68em; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold-dim); font-family: 'Cinzel', serif; margin-bottom: 6px; display: block; }
.media-label.kn { font-family: 'Noto Sans Kannada', sans-serif; font-size: 0.7rem; text-transform: none; letter-spacing: 0; }
.media-title { font-family: 'EB Garamond', serif; font-size: 0.95rem; font-weight: 600; color: var(--text); line-height: 1.4; }
.media-title.kn { font-family: 'Noto Serif Kannada', serif; font-size: 0.88rem; }
/* ── Article card (no video) ── */
.article-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 0 20px; }
.article-card {
  display: flex; flex-direction: column;
  background: var(--section-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 18px; text-decoration: none; color: inherit;
  transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
}
.article-card:hover { transform: translateY(-2px); border-color: var(--gold); box-shadow: 0 4px 12px rgba(139,94,26,0.08); text-decoration: none; }
.article-label { font-size: 0.68em; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold-dim); font-family: 'Cinzel', serif; margin-bottom: 8px; display: block; }
.article-label.kn { font-family: 'Noto Sans Kannada', sans-serif; font-size: 0.7rem; text-transform: none; letter-spacing: 0; }
.article-title { font-family: 'EB Garamond', serif; font-size: 1.1rem; font-weight: 600; color: var(--text); line-height: 1.35; margin-bottom: 8px; }
.article-title.kn { font-family: 'Noto Serif Kannada', serif; font-size: 1rem; }
.article-desc { font-family: 'EB Garamond', serif; font-size: 0.92rem; color: var(--meta); line-height: 1.55; }
.article-desc.kn { font-family: 'Noto Sans Kannada', sans-serif; font-size: 0.85rem; }
/* ── Divider & footer ── */
.section-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 48px 20px 0; }
a { text-decoration: none; color: var(--gold-light); }
a:hover { text-decoration: underline; }
footer { text-align: center; color: var(--meta); margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 0.80em; padding-left: 20px; padding-right: 20px; }
footer.kn { font-family: 'Noto Sans Kannada', sans-serif; }
/* ── Responsive ── */
@media (max-width: 768px) {
  .media-grid { grid-template-columns: repeat(2, 1fr); }
  .article-grid { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .media-grid { grid-template-columns: 1fr; gap: 16px; }
  .site-nav { flex-wrap: wrap; padding: 8px 12px; min-height: unset; }
  .nav-home { width: 100%; padding-bottom: 6px; line-height: 1.4; }
  .nav-links { width: 100%; overflow-x: auto; }
  .nav-link { font-size: 0.72rem; padding: 0 8px; line-height: 32px; }
  .lang-toggle { position: static; margin: 12px auto 0; }
  .page-header { padding: 24px 20px 20px; }
}
</style>

  /* ── NEWSPAPER REPORTS (ಪತ್ರಿಕಾ ವರದಿ) ───────────────────────────
     type: "newspaperReport"
     ADD NEW NEWSPAPER REPORTS ABOVE THE CLOSING COMMENT OF THIS BLOCK
     ──────────────────────────────────────────────────────────── */
  /* ── END NEWSPAPER REPORTS ─────────────────────────────────── */

]; /* end ARTICLES */

/* ═══════════════════════════════════════════════════════════════
   NAV SECTIONS
   ═══════════════════════════════════════════════════════════════ */
const NAV_SECTIONS = [
  { en:"Music",             kn:"ಸಂಗೀತರಚನೆಗಳು",        url:"https://hamsanandi.github.io/compositions/" },
  { en:"Articles",          kn:"ಲೇಖನಗಳು",         url:"https://hamsanandi.github.io/articles/" },
  { en:"Books",             kn:"ಪುಸ್ತಕಗಳು",       url:"https://hamsanandi.github.io/books/" },
  { en:"Metrical Poetry",   kn:"ಛಂದೋಬದ್ಧ ಕಾವ್ಯ",  url:"https://hamsanandi.github.io/poetry/" },
  { en:"Stage Productions", kn:"ರಂಗಪ್ರಯೋಗಗಳು",   url:"https://hamsanandi.github.io/stage-productions/" },
  { en:"Gamaka Vachana",    kn:"ಗಮಕ ವಾಚನ",        url:"https://hamsanandi.github.io/gamaka-vachana/" },
  { en:"Translations",      kn:"ಅನುವಾದಗಳು",       url:"https://hamsanandi.github.io/translations/" },
  { en:"Reviews",           kn:"ವಿಮರ್ಶೆಗಳು",      url:"https://hamsanandi.github.io/reviews/", current:true }
];

/* ═══════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════ */
let lang = 'en';
function renderNav(l) {
  const s = STR[l];
  const navHome = document.getElementById('navHome');
  navHome.textContent = s.navHome;
  navHome.className   = s.navHomeClass;
  const navLinks = document.getElementById('navLinks');
  navLinks.innerHTML  = '';
  NAV_SECTIONS.forEach(sec => {
    const a = document.createElement('a');
    a.href        = sec.url;
    a.textContent = sec[l];
    a.className   = 'nav-link' + (l === 'kn' ? ' kn' : '') + (sec.current ? ' active-section' : '');
    navLinks.appendChild(a);
  });
}
function labelFor(type, s) {
  switch (type) {
    case 'bookReport':      return s.lblBookReport;
    case 'bookDiscussion':  return s.lblBookDiscussion;
    case 'videoReview':     return s.lblVideoReview;
    case 'mediaReport':     return s.lblMediaReport;
    case 'criticalReview':  return s.lblCriticalReview;
    case 'newspaperReport': return s.lblNewspaperReport;
    default: return '';
  }
}
function renderVideoGrid(l) {
  const s    = STR[l];
  const grid = document.getElementById('mediaGrid');
  grid.innerHTML = '';
  VIDEO_REVIEWS.forEach((p, i) => {
    const label      = labelFor(p.type, s);
    const labelClass = 'media-label' + (l === 'kn' ? ' kn' : '');
    const titleClass = 'media-title' + (l === 'kn' ? ' kn' : '');
    const isPlaceholder = !p.id || p.id === 'VIDEO_ID';
    const src = 'https://www.youtube.com/embed/' + p.id + (p.start ? '?start=' + p.start : '');
    const bg  = isPlaceholder
      ? 'background: linear-gradient(135deg, #2a1f10 0%, #4a3520 100%);'
      : `background-image:url('https://img.youtube.com/vi/${p.id}/maxresdefault.jpg'); background-size: cover; background-position: center;`;
    const click = isPlaceholder ? '' : `onclick="loadPlayer('${p.id}-${i}','${src}')"`;
    const card = document.createElement('div');
    card.className = 'media-card';
    card.innerHTML = `
      <div class="video-container" id="wrap-${p.id}-${i}">
        <div class="video-placeholder" style="${bg}" ${click}>
          <div class="play-btn-overlay"></div>
        </div>
      </div>
      <div class="media-info">
        <span class="${labelClass}">${label}</span>
        <div class="${titleClass}">${p[l].title}</div>
      </div>`;
    grid.appendChild(card);
  });
}
function renderArticleGrid(l) {
  const s    = STR[l];
  const grid = document.getElementById('articleGrid');
  grid.innerHTML = '';
  ARTICLES.forEach(p => {
    const label      = labelFor(p.type, s);
    const labelClass = 'article-label' + (l === 'kn' ? ' kn' : '');
    const titleClass = 'article-title' + (l === 'kn' ? ' kn' : '');
    const descClass  = 'article-desc'  + (l === 'kn' ? ' kn' : '');
    const a = document.createElement('a');
    a.href      = p.url;
    a.className = 'article-card';
    a.innerHTML = `
      <span class="${labelClass}">${label}</span>
      <div class="${titleClass}">${p[l].title}</div>
      <div class="${descClass}">${p[l].desc}</div>`;
    grid.appendChild(a);
  });
}
function loadPlayer(wrapId, src) {
  const w = document.getElementById('wrap-' + wrapId);
  w.innerHTML = `<iframe src="${src}${src.includes('?') ? '&' : '?'}autoplay=1" allow="autoplay" allowfullscreen></iframe>`;
}
function applyLang(l) {
  lang = l;
  const s = STR[l];
  document.getElementById('htmlRoot').lang              = l === 'kn' ? 'kn' : 'en';
  document.getElementById('pageTitle').textContent      = s.pageTitle;
  document.getElementById('pageTitle').className        = s.pageTitleClass;
  document.getElementById('pageSubtitle').textContent   = s.pageSubtitle;
  document.getElementById('pageSubtitle').className     = s.pageSubtitleClass;
  document.getElementById('introContent').textContent   = s.introText;
  document.getElementById('introContent').className     = s.introClass;
  document.getElementById('videoHeading').textContent   = s.videoHeading;
  document.getElementById('videoHeading').className     = s.headingClass;
  document.getElementById('articleHeading').textContent = s.articleHeading;
  document.getElementById('articleHeading').className   = s.headingClass;
  document.getElementById('footerEl').textContent       = s.footer;
  document.getElementById('footerEl').className         = 'footer ' + (s.footerClass || '');
  document.getElementById('btnEN').classList.toggle('active', l === 'en');
  document.getElementById('btnKN').classList.toggle('active', l === 'kn');
  renderNav(l);
  renderVideoGrid(l);
  renderArticleGrid(l);
}
document.getElementById('langToggle').addEventListener('click', e => {
  const btn = e.target.closest('.lang-btn');
  if (!btn) return;
  lang = btn.id === 'btnKN' ? 'kn' : 'en';
  applyLang(lang);
});
applyLang('en');
</script>
</body>
</html>
